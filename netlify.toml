[build]
  command = "npm run build"
  publish = "dist-web"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    X-Content-Type-Options = "nosniff"
